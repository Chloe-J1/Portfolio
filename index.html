<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Chloë Jonckheere Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
  </head>

  <body>
    <header>
      <section id="home" class="content">
        <div class="banner">
          <nav class="navBar">
            <p class="navbar-title">Chloë Jonckheere - Gameplay programmer</p>

            <ul>
              <li><a href="#home" class="button">HOME</a></li>
              <li><a href="#projects" class="button">PROJECTS</a></li>
              <li><a href="#about" class="button">ABOUT</a></li>
            </ul>
          </nav>

          <video playsinline autoplay loop muted id="bannerTrailer">
            <source src="Assets/EclipseTrailer.mp4" type="video/mp4">
            <p>Your browser does not support the video tag.</p>
          </video>
        </div>
      </section>
    </header>

    <main>
      <!-- Projects -->
      <section id="projects" class = content>
        <div class="cardContainer">
          <div class="card" onclick="openPage('Projects/eclipse.html')">
            <figure class="card-image">
             <img src="Assets/EclipseSquare.jpg" class="img" alt="Eclipse">
            </figure>
            <div class="tag-container">
              <p class="tag">C#</p>
              <p class="tag">Unity</p>
            </div>
            <h3 class="card-description">Eclipse</h3>
            <p class="card-description">Game description here</p>
          </div>
          <div class="card" onclick="openPage('Projects/clutchPatch.html')">
            <figure class="card-image">
             <img src="Assets/ClutchPatchSmall.png" class="img" alt="Eclipse">
            </figure>
            <div class="tag-container">
              <p class="tag">C#</p>
              <p class="tag">Unity</p>
              <p class="tag">Twitch</p>
            </div>
            <h3 class="card-description">Clutch Patch</h3>
            <p class="card-description">Game description here</p>
          </div>
        </div>
      </section>

      <!-- About -->
      <section id="about" class="content">
        <p>
          ABOUT
        </p>
      </section>
    </main>

    <footer>
      <p>
        CONTACT
      </p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
